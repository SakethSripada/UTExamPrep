<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1030 570">
  <title id="title">Graph-algorithm timing table</title>
  <desc id="desc">A table of timing data in seconds. Edge-count columns and vertex-count rows range from ten thousand to one hundred sixty thousand.</desc>
  <rect width="1030" height="570" fill="#fff"/>
  <style>
    .border { fill: #fff; stroke: #111827; stroke-width: 2; }
    .head { fill: #eaf0ff; stroke: #111827; stroke-width: 2; }
    .label { font: 700 19px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
    .value { font: 18px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
    .side { font: 700 20px Arial, sans-serif; fill: #111827; text-anchor: middle; }
    .note { font: 17px Arial, sans-serif; fill: #374151; text-anchor: middle; }
  </style>
  <text x="610" y="34" class="side">Number of edges E</text>
  <text x="514" y="558" class="note">Times are seconds, rounded to the nearest second.</text>
  <text x="35" y="320" class="side" transform="rotate(-90 35 320)">Number of vertices V</text>

  <rect class="head" x="140" y="65" width="150" height="65"/><text class="label" x="215" y="97">V \ E</text>
  <rect class="head" x="290" y="65" width="145" height="65"/><text class="label" x="362.5" y="97">10,000</text>
  <rect class="head" x="435" y="65" width="145" height="65"/><text class="label" x="507.5" y="97">20,000</text>
  <rect class="head" x="580" y="65" width="145" height="65"/><text class="label" x="652.5" y="97">40,000</text>
  <rect class="head" x="725" y="65" width="145" height="65"/><text class="label" x="797.5" y="97">80,000</text>
  <rect class="head" x="870" y="65" width="145" height="65"/><text class="label" x="942.5" y="97">160,000</text>

  <rect class="head" x="140" y="130" width="150" height="75"/><text class="label" x="215" y="167">10,000</text>
  <rect class="head" x="140" y="205" width="150" height="75"/><text class="label" x="215" y="242">20,000</text>
  <rect class="head" x="140" y="280" width="150" height="75"/><text class="label" x="215" y="317">40,000</text>
  <rect class="head" x="140" y="355" width="150" height="75"/><text class="label" x="215" y="392">80,000</text>
  <rect class="head" x="140" y="430" width="150" height="75"/><text class="label" x="215" y="467">160,000</text>

  <g class="border">
    <rect x="290" y="130" width="145" height="75"/><rect x="435" y="130" width="145" height="75"/><rect x="580" y="130" width="145" height="75"/><rect x="725" y="130" width="145" height="75"/><rect x="870" y="130" width="145" height="75"/>
    <rect x="290" y="205" width="145" height="75"/><rect x="435" y="205" width="145" height="75"/><rect x="580" y="205" width="145" height="75"/><rect x="725" y="205" width="145" height="75"/><rect x="870" y="205" width="145" height="75"/>
    <rect x="290" y="280" width="145" height="75"/><rect x="435" y="280" width="145" height="75"/><rect x="580" y="280" width="145" height="75"/><rect x="725" y="280" width="145" height="75"/><rect x="870" y="280" width="145" height="75"/>
    <rect x="290" y="355" width="145" height="75"/><rect x="435" y="355" width="145" height="75"/><rect x="580" y="355" width="145" height="75"/><rect x="725" y="355" width="145" height="75"/><rect x="870" y="355" width="145" height="75"/>
    <rect x="290" y="430" width="145" height="75"/><rect x="435" y="430" width="145" height="75"/><rect x="580" y="430" width="145" height="75"/><rect x="725" y="430" width="145" height="75"/><rect x="870" y="430" width="145" height="75"/>
  </g>
  <g class="value">
    <text x="362.5" y="167">1</text><text x="507.5" y="167">4</text><text x="652.5" y="167">16</text><text x="797.5" y="167">64</text><text x="942.5" y="167">256</text>
    <text x="362.5" y="242">2</text><text x="507.5" y="242">8</text><text x="652.5" y="242">32</text><text x="797.5" y="242">128</text><text x="942.5" y="242">512</text>
    <text x="362.5" y="317">4</text><text x="507.5" y="317">16</text><text x="652.5" y="317">64</text><text x="797.5" y="317">256</text><text x="942.5" y="317">1000</text>
    <text x="362.5" y="392">8</text><text x="507.5" y="392">32</text><text x="652.5" y="392">128</text><text x="797.5" y="392">512</text><text x="942.5" y="392">2000</text>
    <text x="362.5" y="467">16</text><text x="507.5" y="467">64</text><text x="652.5" y="467">256</text><text x="797.5" y="467">1000</text><text x="942.5" y="467">4000</text>
  </g>
</svg>
