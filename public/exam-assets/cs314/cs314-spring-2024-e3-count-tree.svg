<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1050 770">
  <title id="title">Source example binary tree for count</title>
  <desc id="desc">The root is 5. The tree has left subtree 7 with children 8 and 9, and right subtree 3 with a deeper subtree and right leaf 0.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#111827" stroke-width="1.5"/>
    </marker>
    <style>
      .edge { fill: none; stroke: #111827; stroke-width: 3; marker-end: url(#arrow); }
      .node { fill: #fff; stroke: #111827; stroke-width: 3; }
      .value { font: 700 27px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
      .rootlabel { font: 700 22px Arial, sans-serif; fill: #2563eb; }
    </style>
  </defs>
  <rect width="1050" height="770" fill="#fff"/>

  <path class="edge" d="M525 91 L438 159"/><path class="edge" d="M563 91 L688 159"/>
  <path class="edge" d="M396 220 L302 269"/><path class="edge" d="M426 220 L462 269"/>
  <path class="edge" d="M699 220 L646 269"/><path class="edge" d="M729 220 L797 269"/>
  <path class="edge" d="M622 330 L576 379"/><path class="edge" d="M652 330 L686 379"/>
  <path class="edge" d="M823 330 L842 379"/>
  <path class="edge" d="M565 440 L532 489"/><path class="edge" d="M595 440 L612 489"/>
  <path class="edge" d="M621 550 L650 599"/>

  <path d="M545 28 L545 48" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/><text class="rootlabel" x="565" y="37">root</text>

  <circle class="node" cx="545" cy="72" r="37"/><text class="value" x="545" y="72">5</text>
  <circle class="node" cx="415" cy="195" r="37"/><text class="value" x="415" y="195">7</text>
  <circle class="node" cx="715" cy="195" r="37"/><text class="value" x="715" y="195">3</text>
  <circle class="node" cx="280" cy="305" r="37"/><text class="value" x="280" y="305">8</text>
  <circle class="node" cx="480" cy="305" r="37"/><text class="value" x="480" y="305">9</text>
  <circle class="node" cx="635" cy="305" r="37"/><text class="value" x="635" y="305">7</text>
  <circle class="node" cx="820" cy="305" r="37"/><text class="value" x="820" y="305">9</text>
  <circle class="node" cx="555" cy="415" r="37"/><text class="value" x="555" y="415">5</text>
  <circle class="node" cx="705" cy="415" r="37"/><text class="value" x="705" y="415">4</text>
  <circle class="node" cx="850" cy="415" r="37"/><text class="value" x="850" y="415">0</text>
  <circle class="node" cx="515" cy="525" r="37"/><text class="value" x="515" y="525">5</text>
  <circle class="node" cx="630" cy="525" r="37"/><text class="value" x="630" y="525">7</text>
  <circle class="node" cx="660" cy="635" r="37"/><text class="value" x="660" y="635">7</text>
</svg>
