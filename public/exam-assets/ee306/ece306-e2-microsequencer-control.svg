    <g class="cell"><rect x="0" y="42" width="1170" height="35"/><rect x="0" y="77" width="1170" height="35"/><rect x="0" y="112" width="1170" height="35"/><rect x="0" y="147" width="1170" height="35"/><rect x="0" y="182" width="1170" height="35"/></g>
    <g stroke="#111827" stroke-width="1.5"><line x1="120" x2="120" y1="0" y2="217"/><line x1="182" x2="182" y1="0" y2="217"/><line x1="268" x2="268" y1="0" y2="217"/><line x1="328" x2="328" y1="0" y2="217"/><line x1="388" x2="388" y1="0" y2="217"/><line x1="463" x2="463" y1="0" y2="217"/><line x1="533" x2="533" y1="0" y2="217"/><line x1="625" x2="625" y1="0" y2="217"/><line x1="697" x2="697" y1="0" y2="217"/><line x1="785" x2="785" y1="0" y2="217"/><line x1="885" x2="885" y1="0" y2="217"/><line x1="990" x2="990" y1="0" y2="217"/><line x1="1090" x2="1090" y1="0" y2="217"/></g>
    <rect class="blank" x="2" y="79" width="116" height="31"/><rect class="blank" x="2" y="114" width="116" height="31"/>
    <g class="small">
      <text x="60" y="59">51</text><text x="151" y="59">000</text><text x="225" y="59">111101</text><text x="298" y="59">0</text><text x="358" y="59">1</text><text x="425" y="59">1</text><text x="498" y="59">1</text><text x="579" y="59">X</text><text x="661" y="59">TEMP</text><text x="741" y="59">SR1OUT</text><text x="835" y="59">X</text><text x="937" y="59">X</text><text x="1040" y="59">IR[8:6]</text><text x="1130" y="59">ADD</text>
      <text x="151" y="94">000</text><text x="225" y="94">101111</text><text x="298" y="94">0</text><text x="358" y="94">0</text><text x="425" y="94">1</text><text x="498" y="94">1</text><text x="579" y="94">X</text><text x="661" y="94">X</text><text x="741" y="94">SR1OUT</text><text x="835" y="94">X</text><text x="937" y="94">X</text><text x="1040" y="94">IR[11:9]</text><text x="1130" y="94">NOT</text>
      <text x="151" y="129">000</text><text x="225" y="129">010010</text><text x="298" y="129">1</text><text x="358" y="129">0</text><text x="425" y="129">0</text><text x="498" y="129">0</text><text x="579" y="129">ADDER</text><text x="661" y="129">X</text><text x="741" y="129">X</text><text x="835" y="129">PC</text><text x="937" y="129">offset6</text><text x="1040" y="129">X</text><text x="1130" y="129">X</text>
      <text x="60" y="164">61</text><text x="151" y="164">100</text><text x="225" y="164">110010</text><text x="298" y="164">0</text><text x="358" y="164">0</text><text x="425" y="164">0</text><text x="498" y="164">0</text><text x="579" y="164">X</text><text x="661" y="164">X</text><text x="741" y="164">X</text><text x="835" y="164">X</text><text x="937" y="164">X</text><text x="1040" y="164">X</text><text x="1130" y="164">X</text>
