<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1320 1180">
  <title id="title">Incomplete Moore state machine and truth table</title>
  <desc id="desc">The source exam's four-state Moore machine with blank state and transition labels and an eight-row truth table with blank fields.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#111827" stroke-width="1.5"/>
    </marker>
    <style>
      .edge { fill:none; stroke:#111827; stroke-width:3.5; marker-end:url(#arrow); }
      .state { fill:#fff; stroke:#111827; stroke-width:3; }
      .state-label { font:700 28px Arial,sans-serif; fill:#111827; text-anchor:middle; }
      .label { font:26px Arial,sans-serif; fill:#111827; text-anchor:middle; }
      .blank { fill:#fff; stroke:#111827; stroke-width:3; }
      .table { fill:#fff; stroke:#111827; stroke-width:2; }
      .th { font:700 26px Arial,sans-serif; fill:#111827; text-anchor:middle; dominant-baseline:middle; }
      .td { font:25px Arial,sans-serif; fill:#111827; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>
  <rect width="1320" height="1180" fill="#fff"/>
  <text x="660" y="42" style="font:700 27px Arial,sans-serif;fill:#111827;text-anchor:middle">Complete the Moore state machine and truth table</text>

  <path class="edge" d="M265 228 C155 120 155 405 236 316"/><text class="label" x="205" y="130">X = 0</text>
  <path class="edge" d="M379 300 L910 300"/><text class="label" x="645" y="350">X = 1</text>
  <path class="edge" d="M920 265 L390 265"/><text class="label" x="650" y="235">X =</text><rect class="blank" x="715" y="210" width="48" height="40"/>
  <path class="edge" d="M300 548 L300 385"/><text class="label" x="210" y="480">X = 0</text>
  <path class="edge" d="M936 350 L364 586"/><text class="label" x="690" y="455">X =</text><rect class="blank" x="755" y="430" width="48" height="40"/>
  <path class="edge" d="M379 630 L910 630"/><text class="label" x="645" y="680">X = 1</text>
  <path class="edge" d="M922 580 L382 348"/><text class="label" x="625" y="470">X = 0</text>
  <path class="edge" d="M965 708 C900 825 1140 825 1070 708"/><text class="label" x="1055" y="840">X = 1</text>

  <circle class="state" cx="300" cy="300" r="88"/><text class="state-label" x="300" y="230">00</text><text class="label" x="276" y="315">Y =</text><rect class="blank" x="335" y="285" width="47" height="42"/>
  <circle class="state" cx="1000" cy="300" r="88"/><text class="state-label" x="1065" y="240">01</text><text class="label" x="1000" y="315">Y = 0</text>
  <circle class="state" cx="300" cy="630" r="88"/><rect class="blank" x="370" y="550" width="60" height="42"/><text class="label" x="276" y="645">Y =</text><rect class="blank" x="335" y="615" width="47" height="42"/>
  <circle class="state" cx="1000" cy="630" r="88"/><rect class="blank" x="1080" y="550" width="60" height="42"/><text class="label" x="1000" y="645">Y = 1</text>

  <g>
    <rect class="table" x="205" y="895" width="910" height="225"/>
    <line x1="205" x2="1115" y1="940" y2="940" stroke="#111827" stroke-width="2"/>
    <line x1="205" x2="1115" y1="962.5" y2="962.5" stroke="#111827" stroke-width="1.5"/><line x1="205" x2="1115" y1="985" y2="985" stroke="#111827" stroke-width="1.5"/><line x1="205" x2="1115" y1="1007.5" y2="1007.5" stroke="#111827" stroke-width="1.5"/><line x1="205" x2="1115" y1="1030" y2="1030" stroke="#111827" stroke-width="1.5"/><line x1="205" x2="1115" y1="1052.5" y2="1052.5" stroke="#111827" stroke-width="1.5"/><line x1="205" x2="1115" y1="1075" y2="1075" stroke="#111827" stroke-width="1.5"/><line x1="205" x2="1115" y1="1097.5" y2="1097.5" stroke="#111827" stroke-width="1.5"/>
    <line x1="315" x2="315" y1="895" y2="1120" stroke="#111827" stroke-width="2"/><line x1="425" x2="425" y1="895" y2="1120" stroke="#111827" stroke-width="2"/><line x1="535" x2="535" y1="895" y2="1120" stroke="#111827" stroke-width="5"/><line x1="730" x2="730" y1="895" y2="1120" stroke="#111827" stroke-width="2"/><line x1="925" x2="925" y1="895" y2="1120" stroke="#111827" stroke-width="2"/>
    <text class="th" x="260" y="917">S1</text><text class="th" x="370" y="917">S0</text><text class="th" x="480" y="917">X</text><text class="th" x="632" y="917">S1'</text><text class="th" x="827" y="917">S0'</text><text class="th" x="1020" y="917">Y</text>
    <g class="td">
      <text x="260" y="952">0</text><text x="370" y="952">0</text><text x="480" y="952">0</text><text x="1020" y="952">0</text>
      <text x="260" y="975">0</text><text x="370" y="975">0</text><text x="480" y="975">1</text><text x="632" y="975">0</text><text x="827" y="975">1</text>
      <text x="260" y="997">0</text><text x="370" y="997">1</text><text x="480" y="997">0</text><text x="632" y="997">0</text><text x="827" y="997">0</text><text x="1020" y="997">0</text>
      <text x="260" y="1020">0</text><text x="370" y="1020">1</text><text x="480" y="1020">1</text><text x="632" y="1020">1</text><text x="827" y="1020">0</text>
      <text x="260" y="1042">1</text><text x="370" y="1042">0</text><text x="480" y="1042">0</text><text x="1020" y="1042">0</text>
      <text x="260" y="1065">1</text><text x="370" y="1065">0</text><text x="480" y="1065">1</text><text x="632" y="1065">1</text><text x="827" y="1065">1</text><text x="1020" y="1065">0</text>
      <text x="260" y="1087">1</text><text x="370" y="1087">1</text><text x="480" y="1087">0</text>
      <text x="260" y="1110">1</text><text x="370" y="1110">1</text><text x="480" y="1110">1</text>
    </g>
  </g>
</svg>
