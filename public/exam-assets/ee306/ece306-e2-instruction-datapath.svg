<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1400 900">
  <title id="title">Opcode 1101 format and focused modified LC-3 datapath</title>
  <desc id="desc">The instruction has fields opcode 1101, SR1, SR2, PCoffset6. The focused datapath highlights new TEMP, SEL2 before ALU input B, and SEL1 before ALU input A.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#111827" stroke-width="1.5"/></marker>
    <style>
      .old { fill:#fff; stroke:#6b7280; stroke-width:2.5; }
      .new { fill:#fff; stroke:#111827; stroke-width:5; }
      .oldline { fill:none; stroke:#6b7280; stroke-width:2.5; marker-end:url(#arrow); }
      .newline { fill:none; stroke:#111827; stroke-width:5; marker-end:url(#arrow); }
      .label { font:700 26px Arial,sans-serif; fill:#111827; text-anchor:middle; }
      .text { font:22px Arial,sans-serif; fill:#111827; text-anchor:middle; }
      .tiny { font:18px Arial,sans-serif; fill:#374151; text-anchor:middle; }
      .bit { font:20px Arial,sans-serif; fill:#111827; text-anchor:middle; }
    </style>
  </defs>
  <rect width="1400" height="900" fill="#fff"/>
  <text x="700" y="34" class="label">New instruction format</text>
  <text x="180" y="72" class="bit">15</text><text x="370" y="72" class="bit">12</text><text x="490" y="72" class="bit">11</text><text x="630" y="72" class="bit">9</text><text x="750" y="72" class="bit">8</text><text x="890" y="72" class="bit">6</text><text x="1215" y="72" class="bit">5</text><text x="1305" y="72" class="bit">0</text>
  <rect class="old" x="150" y="85" width="1160" height="90" rx="14"/>
  <line x1="385" x2="385" y1="85" y2="175" stroke="#111827" stroke-width="2"/><line x1="645" x2="645" y1="85" y2="175" stroke="#111827" stroke-width="2"/><line x1="905" x2="905" y1="85" y2="175" stroke="#111827" stroke-width="2"/>
  <text x="267" y="140" style="font:700 44px Arial,sans-serif;fill:#111827;text-anchor:middle">1101</text><text x="515" y="140" style="font:32px Arial,sans-serif;fill:#111827;text-anchor:middle">SR1</text><text x="775" y="140" style="font:32px Arial,sans-serif;fill:#111827;text-anchor:middle">SR2</text><text x="1107" y="140" style="font:32px Arial,sans-serif;fill:#111827;text-anchor:middle">PCoffset6</text>

  <rect x="70" y="230" width="1260" height="600" fill="#fbfcfe" stroke="#9ca3af" stroke-width="2"/>
  <text x="185" y="275" class="text">Existing LC-3 datapath context</text>
  <rect class="old" x="150" y="330" width="260" height="250"/><text class="label" x="280" y="395">REG</text><text class="label" x="280" y="428">FILE</text>
  <text class="text" x="225" y="500">SR2OUT</text><text class="text" x="345" y="500">SR1OUT</text>
  <path class="oldline" d="M345 535 V690 H775"/>
  <path class="oldline" d="M225 535 V625 H568"/>
  <path class="newline" d="M335 535 V300 H1130 V390"/>
  <rect class="new" x="1065" y="370" width="130" height="55"/><text class="label" x="1130" y="405">TEMP</text><text x="1218" y="405" class="text" style="text-anchor:start">LD.TEMP</text>
  <path class="newline" d="M1130 425 V570 H618 V605"/>

  <polygon class="new" points="555,605 650,605 680,655 650,705 555,705 585,655"/><text class="label" x="618" y="664">SEL2</text>
  <polygon class="new" points="765,605 860,605 890,655 860,705 765,705 795,655"/><text class="label" x="828" y="664">SEL1</text>
  <path class="newline" d="M680 655 H735 V720 H815 V735"/>
  <path class="newline" d="M890 655 H960 V735"/>
  <path class="new" d="M755 735 H1025 L990 805 H790 Z"/><text class="label" x="890" y="783">ALU</text>
  <path class="newline" d="M890 805 V850"/><text x="980" y="842" class="text">GateALU</text>
  <text x="700" y="880" class="tiny">Thick outlines and wires identify the added TEMP path and the two new multiplexers.</text>
</svg>
