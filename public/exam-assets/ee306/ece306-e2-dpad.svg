<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1320 620">
  <title id="title">D-pad and four-bit direction encodings</title>
  <desc id="desc">A four-direction pad labeled Up, Down, Left, Right. Direction bit fields are Up 1000, Down 0100, Left 0010, Right 0001 with bit positions 3 through 0.</desc>
  <style>
    .shape { fill:#fff; stroke:#111827; stroke-width:6; stroke-linejoin:round; }
    .line { stroke:#111827; stroke-width:3; }
    .label { font:700 28px Arial,sans-serif; fill:#111827; text-anchor:middle; }
    .bit { font:28px Arial,sans-serif; fill:#111827; text-anchor:middle; dominant-baseline:middle; }
    .caption { font:23px Arial,sans-serif; fill:#374151; text-anchor:middle; }
  </style>
  <rect width="1320" height="620" fill="#fff"/>
  <text x="660" y="42" class="caption">D-pad input (GC_SR = xFEA0; GC_DR = xFEA2; data bits [3:0])</text>
  <g transform="translate(660 225)">
    <path class="shape" d="M-35 -130 H35 V-45 H120 V35 H35 V120 H-35 V35 H-120 V-45 H-35 Z"/>
    <path class="line" d="M-35 -45 L35 35 M35 -45 L-35 35"/>
    <text class="label" x="0" y="-158">UP</text><text class="label" x="0" y="155">DOWN</text><text class="label" x="-170" y="5">LEFT</text><text class="label" x="175" y="5">RIGHT</text>
  </g>
  <g transform="translate(92 470)">
    <text class="label" x="92" y="-54">Up</text><text class="caption" x="110" y="-20">3</text><text class="caption" x="165" y="-20">2</text><text class="caption" x="220" y="-20">1</text><text class="caption" x="275" y="-20">0</text>
    <rect class="shape" x="70" y="0" width="260" height="64"/><line class="line" x1="135" x2="135" y1="0" y2="64"/><line class="line" x1="200" x2="200" y1="0" y2="64"/><line class="line" x1="265" x2="265" y1="0" y2="64"/>
    <text class="bit" x="102" y="33">1</text><text class="bit" x="167" y="33">0</text><text class="bit" x="232" y="33">0</text><text class="bit" x="297" y="33">0</text>
  </g>
  <g transform="translate(390 470)">
    <text class="label" x="92" y="-54">Down</text><text class="caption" x="110" y="-20">3</text><text class="caption" x="165" y="-20">2</text><text class="caption" x="220" y="-20">1</text><text class="caption" x="275" y="-20">0</text>
    <rect class="shape" x="70" y="0" width="260" height="64"/><line class="line" x1="135" x2="135" y1="0" y2="64"/><line class="line" x1="200" x2="200" y1="0" y2="64"/><line class="line" x1="265" x2="265" y1="0" y2="64"/>
    <text class="bit" x="102" y="33">0</text><text class="bit" x="167" y="33">1</text><text class="bit" x="232" y="33">0</text><text class="bit" x="297" y="33">0</text>
  </g>
  <g transform="translate(690 470)">
    <text class="label" x="92" y="-54">Left</text><text class="caption" x="110" y="-20">3</text><text class="caption" x="165" y="-20">2</text><text class="caption" x="220" y="-20">1</text><text class="caption" x="275" y="-20">0</text>
    <rect class="shape" x="70" y="0" width="260" height="64"/><line class="line" x1="135" x2="135" y1="0" y2="64"/><line class="line" x1="200" x2="200" y1="0" y2="64"/><line class="line" x1="265" x2="265" y1="0" y2="64"/>
    <text class="bit" x="102" y="33">0</text><text class="bit" x="167" y="33">0</text><text class="bit" x="232" y="33">1</text><text class="bit" x="297" y="33">0</text>
  </g>
  <g transform="translate(990 470)">
    <text class="label" x="92" y="-54">Right</text><text class="caption" x="110" y="-20">3</text><text class="caption" x="165" y="-20">2</text><text class="caption" x="220" y="-20">1</text><text class="caption" x="275" y="-20">0</text>
    <rect class="shape" x="70" y="0" width="260" height="64"/><line class="line" x1="135" x2="135" y1="0" y2="64"/><line class="line" x1="200" x2="200" y1="0" y2="64"/><line class="line" x1="265" x2="265" y1="0" y2="64"/>
    <text class="bit" x="102" y="33">0</text><text class="bit" x="167" y="33">0</text><text class="bit" x="232" y="33">0</text><text class="bit" x="297" y="33">1</text>
  </g>
</svg>
