<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1320 620">
  <title id="title">Player linked-list storage representation</title>
  <desc id="desc">R0 contains the address of HEAD. HEAD points to Node zero, followed by Node one and an omitted middle sequence ending at Node N minus one. Every node's first word is a next pointer and second word is a player number.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#111827" stroke-width="1.8"/>
    </marker>
    <style>
      .box { fill:#fff; stroke:#111827; stroke-width:3; }
      .wire { fill:none; stroke:#111827; stroke-width:3.5; marker-end:url(#arrow); }
      .dashed { fill:none; stroke:#111827; stroke-width:3.5; stroke-dasharray:10 11; marker-end:url(#arrow); }
      .label { font:700 27px Arial,sans-serif; fill:#111827; text-anchor:middle; }
      .text { font:25px Arial,sans-serif; fill:#111827; text-anchor:middle; dominant-baseline:middle; }
      .caption { font:22px Arial,sans-serif; fill:#374151; text-anchor:middle; }
    </style>
  </defs>
  <rect width="1320" height="620" fill="#fff"/>
  <text x="660" y="42" class="caption">Each node occupies two consecutive words: next pointer, then 16-bit player number.</text>

  <rect class="box" x="110" y="145" width="175" height="66"/><text class="label" x="197.5" y="187">R0</text>
  <circle cx="197.5" cy="230" r="7" fill="#111827"/><path class="wire" d="M197.5 211 V282"/>
  <rect class="box" x="110" y="282" width="175" height="76"/><text class="text" x="197.5" y="322">HEAD</text><circle cx="250" cy="322" r="7" fill="#111827"/>

  <text class="label" x="500" y="150">Node 0</text>
  <rect class="box" x="390" y="172" width="220" height="145"/><line x1="390" x2="610" y1="244" y2="244" stroke="#111827" stroke-width="3"/>
  <circle cx="500" cy="208" r="7" fill="#111827"/><text class="text" x="500" y="280">0th Player #</text>
  <path class="wire" d="M257 322 L390 208"/>
  <path class="wire" d="M507 208 H658"/>

  <text class="label" x="755" y="150">Node 1</text>
  <rect class="box" x="660" y="172" width="190" height="145"/><line x1="660" x2="850" y1="244" y2="244" stroke="#111827" stroke-width="3"/>
  <circle cx="755" cy="208" r="7" fill="#111827"/><text class="text" x="755" y="280">1st Player #</text>
  <path class="dashed" d="M762 208 H945"/>
  <text x="890" y="214" class="text">...</text>

  <text class="label" x="1085" y="150">Node N-1</text>
  <rect class="box" x="965" y="172" width="235" height="145"/><line x1="965" x2="1200" y1="244" y2="244" stroke="#111827" stroke-width="3"/>
  <text class="text" x="1082.5" y="208">x0000</text><text class="text" x="1082.5" y="280">(n-1)th Player #</text>
  <path class="dashed" d="M900 208 H964"/>
  <text x="660" y="420" class="caption">R4 can retain the predecessor address while R0 advances through the list.</text>
</svg>
