<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1490" role="img" aria-labelledby="title description">
  <title id="title">Multirate filterbank diagrams and responses</title>
  <desc id="description">Four impulse-response stem charts, six labeled magnitude response curves, and six cascaded analysis and synthesis block diagrams for the ECE 313 multirate filtering problem.</desc>
  <style>
    .axis { stroke: #263645; stroke-width: 1.5; }
    .grid { stroke: #d9e1e8; stroke-width: 1; }
    .stem { stroke: #172b3a; stroke-width: 2; }
    .dot { fill: #111827; }
    .title { fill: #172b3a; font: 700 20px ui-sans-serif, system-ui, sans-serif; }
    .label { fill: #172b3a; font: 21px Georgia, serif; }
    .tick { fill: #526170; font: 15px ui-sans-serif, system-ui, sans-serif; }
    .block { fill: #fff; stroke: #334155; stroke-width: 1.2; }
    .blocktext { fill: #172b3a; font: italic 20px Georgia, serif; text-anchor: middle; dominant-baseline: middle; }
    .rowline { stroke: #cbd5e1; stroke-width: 1; }
    .arrow { stroke: #172b3a; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
  </style>
  <defs><marker id="arrowhead" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#172b3a"/></marker></defs>
  <rect width="1600" height="1490" fill="#fff"/>
  <text x="800" y="38" text-anchor="middle" class="label">Analysis and synthesis filters, magnitude responses, and system block diagrams</text>

