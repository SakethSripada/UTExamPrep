<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110" role="img" aria-labelledby="title description">
  <title id="title">Input and output chirp spectrograms</title>
  <desc id="description">Three recreated spectrograms: a chirp increasing from zero to eight kilohertz, a lowpass-filtered output that stops near two kilohertz, and a cubic-nonlinearity output with extra aliased N-shaped traces.</desc>
  <defs>
    <linearGradient id="spectrogram" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#76809a"/><stop offset=".45" stop-color="#454b63"/><stop offset="1" stop-color="#252838"/></linearGradient>
    <linearGradient id="power" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#050505"/><stop offset=".55" stop-color="#67708f"/><stop offset="1" stop-color="#e7ffff"/></linearGradient>
  </defs>
  <style>
    .frame { fill: url(#spectrogram); stroke: #3d4658; stroke-width: 1.4; }
    .grid { stroke: #a8b1c5; stroke-opacity: .18; stroke-width: 1; }
    .trace { fill: none; stroke: #eaffff; stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 5px #c1ffff); }
    .trace-dim { fill: none; stroke: #8ea0d4; stroke-width: 4; stroke-linecap: round; opacity: .78; }
    .tick { fill: #334155; font: 17px ui-sans-serif, system-ui, sans-serif; }
    .label { fill: #172b3a; font: 23px Georgia, serif; }
    .subtitle { fill: #172b3a; font: 22px Georgia, serif; font-style: italic; }
    .note { fill: #526170; font: 16px ui-sans-serif, system-ui, sans-serif; }
  </style>
  <rect width="1200" height="1110" fill="#fff"/>
  <text x="535" y="38" text-anchor="middle" class="subtitle">Spectrograms for the chirp system-identification problem</text>

  <!-- Shared x positions map 0–5 seconds; y maps 0–8 kHz. -->
  <g>
    <text x="110" y="73" class="subtitle">Input chirp x[n]</text>
    <rect class="frame" x="110" y="88" width="850" height="220"/>
    <g class="grid"><path d="M110 143H960 M110 198H960 M110 253H960 M280 88V308 M450 88V308 M620 88V308 M790 88V308"/></g>
    <path class="trace" d="M110 308 L960 88"/>
    <rect x="978" y="88" width="28" height="220" fill="url(#power)" stroke="#556070"/>
    <g class="tick" text-anchor="end"><text x="98" y="312">0</text><text x="98" y="257">2</text><text x="98" y="202">4</text><text x="98" y="147">6</text><text x="98" y="93">8</text></g>
    <g class="tick" text-anchor="middle"><text x="110" y="334">0</text><text x="280" y="334">1</text><text x="450" y="334">2</text><text x="620" y="334">3</text><text x="790" y="334">4</text><text x="960" y="334">5</text></g>
    <text x="535" y="362" text-anchor="middle" class="label">Time [s]</text><text x="35" y="198" text-anchor="middle" class="label" transform="rotate(-90 35 198)">Frequency [kHz]</text>
    <text x="1021" y="104" class="tick">−20</text><text x="1021" y="208" class="tick">−80</text><text x="1021" y="304" class="tick">−140 dB/Hz</text>
  </g>

  <g>
    <text x="110" y="412" class="subtitle">(a) Output spectrogram: lowpass system</text>
    <rect class="frame" x="110" y="427" width="850" height="220"/>
    <g class="grid"><path d="M110 482H960 M110 537H960 M110 592H960 M280 427V647 M450 427V647 M620 427V647 M790 427V647"/></g>
    <rect x="374" y="427" width="586" height="220" fill="#030406" opacity=".91"/>
    <path class="trace" d="M110 647 L374 578"/>
    <path class="trace-dim" d="M374 578 L960 427"/>
    <rect x="978" y="427" width="28" height="220" fill="url(#power)" stroke="#556070"/>
    <g class="tick" text-anchor="end"><text x="98" y="651">0</text><text x="98" y="596">2</text><text x="98" y="541">4</text><text x="98" y="486">6</text><text x="98" y="432">8</text></g>
    <g class="tick" text-anchor="middle"><text x="110" y="673">0</text><text x="280" y="673">1</text><text x="450" y="673">2</text><text x="620" y="673">3</text><text x="790" y="673">4</text><text x="960" y="673">5</text></g>
    <text x="535" y="701" text-anchor="middle" class="label">Time [s]</text><text x="35" y="537" text-anchor="middle" class="label" transform="rotate(-90 35 537)">Frequency [kHz]</text>
    <text x="1021" y="443" class="tick">−20</text><text x="1021" y="547" class="tick">−80</text><text x="1021" y="643" class="tick">−140 dB/Hz</text>
  </g>

  <g>
    <text x="110" y="751" class="subtitle">(b) Output spectrogram: pointwise nonlinearity</text>
    <rect class="frame" x="110" y="766" width="850" height="220"/>
    <g class="grid"><path d="M110 821H960 M110 876H960 M110 931H960 M280 766V986 M450 766V986 M620 766V986 M790 766V986"/></g>
    <path class="trace" d="M110 986 L960 766"/>
    <path class="trace" d="M110 986 L393 766 L676 986 L960 766"/>
    <path class="trace-dim" d="M110 984 L393 764 M676 984 L960 764"/>
    <rect x="978" y="766" width="28" height="220" fill="url(#power)" stroke="#556070"/>
    <g class="tick" text-anchor="end"><text x="98" y="990">0</text><text x="98" y="935">2</text><text x="98" y="880">4</text><text x="98" y="825">6</text><text x="98" y="771">8</text></g>
    <g class="tick" text-anchor="middle"><text x="110" y="1012">0</text><text x="280" y="1012">1</text><text x="450" y="1012">2</text><text x="620" y="1012">3</text><text x="790" y="1012">4</text><text x="960" y="1012">5</text></g>
    <text x="535" y="1040" text-anchor="middle" class="label">Time [s]</text><text x="35" y="876" text-anchor="middle" class="label" transform="rotate(-90 35 876)">Frequency [kHz]</text>
    <text x="1021" y="782" class="tick">−20</text><text x="1021" y="886" class="tick">−80</text><text x="1021" y="982" class="tick">−140 dB/Hz</text>
  </g>
  <text x="110" y="1080" class="note">The recreated frequency traces encode the same evidence as the source: a 0–2 kHz lowpass cutoff in (a), and an added 3× chirp component that aliases in (b).</text>
</svg>
